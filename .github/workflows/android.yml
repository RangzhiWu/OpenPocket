name: Android CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
      - run: python3 scripts/audit-public.py
      - name: Lint and debug build
        working-directory: android-client
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android-client/app/build/reports/lint-results-release.*
